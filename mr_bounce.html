<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mr. Bounce Secrets</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0d0d0d;
      color: #fff;
      font-family: 'Georgia', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      overflow: hidden;
    }

    .stars {
      position: fixed;
      width: 100%;
      height: 100%;
      z-index: 0;
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
    }

    .content {
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: 3.5rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #ffd700;
      text-shadow: 0 0 20px #ffd700, 0 0 40px #ff8c00;
      margin-bottom: 10px;
      animation: pulse 2s infinite;
    }

    .subtitle {
      font-size: 1.1rem;
      color: #aaa;
      margin-bottom: 40px;
      letter-spacing: 2px;
    }

    @keyframes pulse {
      0%, 100% { text-shadow: 0 0 20px #ffd700, 0 0 40px #ff8c00; }
      50%       { text-shadow: 0 0 40px #ffd700, 0 0 80px #ff4500; }
    }

    button {
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      color: #000;
      border: none;
      padding: 16px 40px;
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 2px;
      border-radius: 50px;
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 0 20px #ffd70088;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: scale(1.08);
      box-shadow: 0 0 40px #ffd700cc;
    }

    button:active {
      transform: scale(0.97);
    }

    #video-container {
      display: none;
      margin-top: 40px;
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    #video-container video,
    #video-container iframe {
      width: 640px;
      max-width: 90vw;
      height: 360px;
      border-radius: 12px;
      border: 3px solid #ffd700;
      box-shadow: 0 0 30px #ffd70066;
    }

    .secret-label {
      margin-top: 16px;
      font-size: 1rem;
      color: #ffd700;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

  <div class="stars"></div>

  <div class="content">
    <h1>🎩 Mr. Bounce Secrets 🎩</h1>
    <p class="subtitle">⚠️ Top Secret — For Your Eyes Only ⚠️</p>

    <button onclick="revealSecret()">🔓 Reveal My Secrets</button>

    <div id="video-container">
      <!-- Ersetze die src-URL mit deinem eigenen Video-Link -->
      <iframe
        src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1"
        title="Mr. Bounce Secret Video"
        frameborder="0"
        allow="autoplay; encrypted-media"
        allowfullscreen>
      </iframe>
      <p class="secret-label">🤫 Das Geheimnis wurde enthüllt...</p>
    </div>
  </div>

  <script>
    function revealSecret() {
      const container = document.getElementById('video-container');
      const btn = document.querySelector('button');

      container.style.display = 'block';
      btn.textContent = '🔒 Secret Revealed!';
      btn.disabled = true;
      btn.style.opacity = '0.6';
      btn.style.cursor = 'default';
    }
  </script>

</body>
</html>
